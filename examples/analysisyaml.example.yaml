# Project-level configuration. Replace every path before running RNAFlow.
project_name: "RNAFlow_example"
Genome_Version: "GRCm39"
species: "Mus musculus"
client: "Internal"

raw_data_path:
  - "/absolute/path/to/project/00.raw_data"
sample_csv: "/absolute/path/to/project/01.workflow/samples.csv"
paired_csv: "/absolute/path/to/project/01.workflow/contrasts.csv"
workflow: "/absolute/path/to/project/01.workflow"
data_deliver: "/absolute/path/to/project/02.data_deliver"

execution_mode: "local"
Library_Types: "fr-firststrand"

only_qc: false
fastq_screen: true
deg: true
call_variant: false
detect_novel_transcripts: false
rmats: true
gene_fusion: false
deliver: true
project_summary: true
report: false

# Platform task context, required for the BioReport 2.1.0 project_summary.json
# delivery (project.user_id / platform.task_id). These must be the real IDs of
# the submitting task context; do not ship example placeholders.
platform:
  user_id: "platform-user-id"
  task_id: "platform-task-id"
  # Optional overrides (sensible defaults are derived from the run):
  # title: "RNA-seq 差异表达分析报告 2026-10-24"
  # status: "completed"
  # expire_at: "2026-11-23T15:30:12+08:00"   # ISO 8601 with timezone, or null
  # html_entry: "report.html"

# These roots are normally inherited from config/reference.yaml.
# Set them here when running on another machine.
reference_path: "/absolute/path/to/RNAFlow_reference"
fastq_screen_db_path: "/absolute/path/to/fastq_screen_database"
