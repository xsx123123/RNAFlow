module:
  id: "14.Report"
  title: "项目结果 JSON 导出与旧报告入口"
  snakefile: "rules/14.Report.smk"
  stage: "report"
  summary: >
    独立生成 v2.1.0 project_summary.json(项目元信息/平台任务绑定/结果文件语义索引/
    样本统计/相对路径/GO 与 KEGG 分组结果),用于外部报告仓库。
    旧容器化 HTML 渲染入口保留但默认关闭。
  requires_helpers: ["utils.common"]

rules:
  - name: generate_docker_json
    summary: "读取交付数据,导出 BioReport 2.1.0 契约 JSON(平台绑定 + files 索引 + GO/KEGG 分组方向结果)"
    wildcards: []
    dynamic: false
    per_sample: false
    inputs:
      - name: manifest_json
        port: "report_delivery_manifest_json"
        pattern: "{data_deliver}/report_data/delivery_manifest.json"
      - name: manifest_md5
        port: "report_delivery_manifest_md5"
        pattern: "{data_deliver}/report_data/delivery_manifest.md5"
      - name: manifest_log
        port: "report_delivery_details_log"
        pattern: "{data_deliver}/report_data/delivery_details.log"
      - name: sample_sheet
        port: "sample_sheet"
        pattern: "{sample_csv}"
      - name: summary_builder
        port: "project_summary_builder"
        pattern: "rules/utils/project_summary.py"
      - name: summary_schema
        port: "project_summary_schema"
        pattern: "schema/project_summary.schema.json"
    outputs:
      - name: json_file
        port: "project_summary_json"
        pattern: "{data_deliver}/report_data/project_summary.json"
        kind: final
    config_requires:
      - key: "project_summary"
        type: "boolean"
        default: true
        description: "项目 JSON 导出开关,独立于旧 HTML 报告"
      - key: "data_deliver"
        type: "string"
        description: "交付输出根目录(由 CLI --analysisyaml 注入,无默认值)"
      - key: "sample_csv"
        type: "string"
        description: "样本信息表 CSV 路径(列 sample/sample_name/group,由 CLI --analysisyaml 注入)"
      - key: "client"
        type: "string"
        description: "客户名称,写入报告项目元信息(由 CLI --analysisyaml 注入)"
      - key: "species"
        type: "string"
        description: "物种,写入报告项目元信息(由 CLI --analysisyaml 注入)"
      - key: "Genome_Version"
        type: "string"
        description: "参考基因组版本,写入报告项目元信息(由 CLI --analysisyaml 注入)"
      - key: "pipeline_version"
        type: "string"
        default: "0.2.0"
        description: "流程版本号,写入报告项目元信息"
      - key: "platform.user_id"
        type: "string"
        description: "平台用户 ID(2.1.0 必填,须由真实任务上下文注入,不得用占位值)"
      - key: "platform.task_id"
        type: "string"
        description: "平台任务 ID(2.1.0 必填,须由真实任务上下文注入,不得用占位值)"
    conda: "envs/py3.12.yaml"
    resources_tier: "low_resource"

  - name: Report
    summary: "按 report_engine 探测容器引擎,运行 Quarto 镜像渲染最终交互式 HTML 分析报告"
    wildcards: []
    dynamic: true
    per_sample: false
    inputs:
      - name: analysis_targets  # .smk 中为匿名 input:ANALYSIS_TARGETS(snakefile 全局收集器,按启用模块展开全部上游产物,无单一路径模板)
        port: "analysis_targets"  # ⚠ 聚合端口,ports.yaml 尚未登记,需注册表 Owner 补登
        pattern: "{workflow}"  # 收集器动态展开 config['workflow'] 工作区下全部启用模块产物,动态 I/O 以 dynamic: true 声明
      - name: json_file
        port: "project_summary_json"
        pattern: "{data_deliver}/report_data/project_summary.json"
      - name: manifest_json
        port: "report_delivery_manifest_json"
        pattern: "{data_deliver}/report_data/delivery_manifest.json"
      - name: manifest_md5
        port: "report_delivery_manifest_md5"
        pattern: "{data_deliver}/report_data/delivery_manifest.md5"
      - name: manifest_log
        port: "report_delivery_details_log"
        pattern: "{data_deliver}/report_data/delivery_details.log"
    outputs:
      - name: Report_html
        port: "analysis_report_html"
        pattern: "{data_deliver}/Analysis_Report/index.html"
        kind: report
    config_requires:
      - key: "report"
        type: "boolean"
        default: false
        description: "旧 HTML 渲染开关,默认关闭,不影响独立 JSON 导出"
      - key: "data_deliver"
        type: "string"
        description: "交付输出根目录(report_data/data 与 Analysis_Report 挂载源,由 CLI --analysisyaml 注入)"
      - key: "parameter.Report.docker_version"
        type: "string"
        default: "bioreportrna:v0.0.7"
        description: "报告容器镜像(需本地已存在,docker 模式下镜像缺失会直接报错)"
      - key: "report_engine"
        type: "string"
        enum: ["auto", "docker", "apptainer", "singularity"]
        default: "auto"
        description: "报告容器引擎;auto 按 docker→apptainer→singularity 顺序探测"
      - key: "parameter.threads.Report"
        type: "integer"
        minimum: 1
        default: 10
        description: "Report 渲染线程数"
    conda: "envs/py3.12.yaml"
    resources_tier: "high_resource"
