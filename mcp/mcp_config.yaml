# RNAFlow MCP 服务器路径配置
# 如果 conda 或 snakemake 不在系统 PATH 中，请取消注释并修改下方路径

# Conda 的二进制文件路径 (留空则自动从 PATH 中检测)
# 例如: /home/user/miniconda3/bin/conda
conda_path: ""

# Snakemake 的二进制文件路径 (留空则自动从 PATH 中检测)
# 例如: /home/user/miniconda3/envs/snakemake/bin/snakemake
snakemake_path: ""

# 默认激活的 conda 环境名称
default_env: "snakemake"

# ========== 远程服务配置 ==========
# 监听地址 (默认 127.0.0.1，仅本地访问；如需远程访问可改为 0.0.0.0)
host: "127.0.0.1"
# 监听端口
port: 8000
